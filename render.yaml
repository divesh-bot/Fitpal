# Render Blueprint for the FitPal API (backend/ only).
# Docs: https://render.com/docs/blueprint-spec
#
# Secrets and deployment-specific values use `sync: false`: Render asks for
# them when the Blueprint is first applied, and they are never stored in git.
services:
  - type: web
    name: fitpal-api
    runtime: node
    rootDir: backend
    region: singapore # closest Render region to India
    plan: free # sleeps after 15 min idle; switch to a paid plan for always-on
    # NODE_ENV=production would make plain `npm ci` skip devDependencies
    # (TypeScript is needed to build), so include them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Two proxy layers sit in front of the app on Render (edge network +
      # load balancer). Measured after the first deploy: with 1, the rate
      # limiter saw rotating proxy IPs instead of the client. Signed-in
      # requests are additionally limited per account, which does not
      # depend on this value.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "600"
      # The Cloudflare frontend URL, e.g. https://fitpal.<your-subdomain>.workers.dev
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
